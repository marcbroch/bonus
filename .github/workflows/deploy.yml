name: Auf IONOS veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Vor dem Hochladen testen – mit PHP 7.4 (wie der IONOS-Webspace) und PHP 8.3
  pruefen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: PHP-Syntax prüfen
        run: for f in *.php; do php -l "$f" || exit 1; done
      - name: App kurz durchtesten
        run: .github/smoke-test.sh

  veroeffentlichen:
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per SFTP hochladen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ] || [ -z "$SFTP_REMOTE_DIR" ]; then
            echo "::error::Es fehlen Zugangsdaten. Bitte SFTP_HOST, SFTP_USER, SFTP_PASSWORD und SFTP_REMOTE_DIR unter Settings > Secrets and variables > Actions anlegen."
            exit 1
          fi
          # Sicherheitsnetz: nie direkt ins Hauptverzeichnis des Webspace hochladen
          case "$SFTP_REMOTE_DIR" in
            "/"|"."|"./") echo "::error::SFTP_REMOTE_DIR darf nicht das Hauptverzeichnis sein."; exit 1 ;;
          esac

          # Kein --delete: Datenbank (data/) und Fotos (uploads/) auf dem Server bleiben unangetastet.
          EXCLUDES="-X .git/ -X .github/ -X .gitignore -X CLAUDE.md -X ANLEITUNG.txt -X EINRICHTUNG-IONOS.md -X data/*.sqlite*"
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; open -u '$SFTP_USER' --env-password 'sftp://$SFTP_HOST'; mirror --reverse --verbose $EXCLUDES ./ '$SFTP_REMOTE_DIR'"

      - name: Live-Seite prüfen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          START=$(TZ=Europe/Berlin date -d '-1 minute' '+%Y-%m-%d %H:%M:%S')
          sleep 3
          URL="https://brochhaus.name/bonus/index.php?p=login"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo 000)
          echo "Anmeldeseite: HTTP $code"
          # Neue Einträge im Fehlerprotokoll der App seit diesem Upload
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 2; open -u '$SFTP_USER' --env-password 'sftp://$SFTP_HOST'; cat '$SFTP_REMOTE_DIR/data/error.log'" 2>/dev/null \
            | awk -v s="$START" 'substr($0, 1, 19) >= s' > neue-fehler.txt || true
          if [ -s neue-fehler.txt ]; then
            echo "--- Neue Einträge in data/error.log ---"; tail -n 20 neue-fehler.txt
            echo "::error::Die App hat nach dem Upload Fehler protokolliert."
            exit 1
          fi
          echo "Keine neuen Fehler im Protokoll."
          if [ "$code" != "200" ]; then
            echo "::error::Die Live-Seite antwortet mit HTTP $code statt 200."
            exit 1
          fi
